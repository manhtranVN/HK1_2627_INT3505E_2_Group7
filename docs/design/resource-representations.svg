<text x="58" y="1936.375" font-size="17" fill="#334155" font-weight="normal">Nét liền: object/array nhúng trong JSON. Nét đứt: UUID reference hoặc ngữ cảnh owner, không phải khóa ngoại DB.</text>
<text x="58" y="1978.375" font-size="17" fill="#334155" font-weight="normal">1 / 0..*: số object trong representation hoặc số resource được tham chiếu. Không biểu diễn lifecycle/composition của bảng.</text>
<text x="58" y="2020.375" font-size="17" fill="#334155" font-weight="normal">Đây là trích chọn các trường phục vụ mô hình; schema đầy đủ, required/nullable và methods nằm trong OpenAPI và trang 01.</text>
