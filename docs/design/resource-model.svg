<text x="58" y="2246.75" font-size="18" fill="#334155" font-weight="normal">Core: GET /api/v1/health → HealthStatus. Các node AI màu tím chỉ là ngữ cảnh dự kiến, chưa có operation trong contract.</text>
<text x="58" y="2288.75" font-size="18" fill="#334155" font-weight="normal">Method lấy từ OpenAPI hiện tại; node namespace không tạo endpoint mới. /auth/login và /auth/register là ngoại lệ thao tác auth được giữ nguyên.</text>
<text x="58" y="2330.75" font-size="18" fill="#334155" font-weight="normal">Không đưa users, movie_genres hay user_genre_preferences thành endpoint chỉ vì tồn tại bảng DB.</text>
<text x="58" y="2372.75" font-size="18" fill="#334155" font-weight="normal">Trang 02 trình bày JSON representation và tham chiếu; trang 01 không mô tả FK, deployment hay luồng thao tác của người dùng.</text>
