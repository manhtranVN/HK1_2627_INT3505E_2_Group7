<text x="68" y="1306.625" font-size="15" fill="#334155" font-weight="normal">PK = primary key | FK = foreign key | PK/FK = both | UQ = unique | ? = nullable</text>
<text x="68" y="1328.625" font-size="15" fill="#334155" font-weight="normal">Each parent has 0..N children; each child references exactly 1 parent (NOT NULL FK).</text>
<text x="68" y="1350.625" font-size="15" fill="#334155" font-weight="normal">Composite PK prevents duplicate user/movie, movie/genre and user/genre pairs.</text>
<text x="68" y="1372.625" font-size="15" fill="#334155" font-weight="normal">Ratings: 0.5..5.0, step 0.5. Progress: seconds &gt;= 0; duration bound checked by service.</text>
<text x="68" y="1394.625" font-size="15" fill="#334155" font-weight="normal">Source: openapi/openapi.yaml. Original ERD retained at docs/design/archive/erd-original.drawio.</text>
