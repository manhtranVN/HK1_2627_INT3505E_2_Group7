x-database:
  engine: PostgreSQL
  description: 'Design metadata; not a migration. Source for build_design.py; do not hand-edit generated diagrams/dictionaries.
    UUIDs are generated by the future server. All FK columns are NOT NULL. Physical deletes: users cascade to personal
    relations; movies/genres restrict while referenced. Admin DELETE only hides movies.'
  tables:
    users:
      columns:
      - name: id
        type: uuid
        nullable: false
        description: Internal account ID.
        primary_key: true
      - name: email
        type: varchar(254)
        nullable: false
        description: Normalized lowercase email; unique.
        unique: true
      - name: password_hash
        type: text
        nullable: false
        description: Password hash; never serialized.
      - name: display_name
        type: varchar(100)
        nullable: false
        description: Public display name.
      - name: role
        type: varchar(16)
        nullable: false
        description: user or admin.
        default: user
      - name: status
        type: varchar(16)
        nullable: false
        description: active or disabled.
        default: active
      - name: created_at
        type: timestamptz
        nullable: false
        description: UTC creation time.
        default: now()
      checks:
      - role IN ('user','admin')
      - status IN ('active','disabled')
    movies:
      columns:
      - name: id
        type: uuid
        nullable: false
        description: Internal movie ID.
        primary_key: true
      - name: tmdb_id
        type: bigint
        nullable: true
        description: Optional external TMDB ID.
        unique: true
      - name: slug
        type: varchar(255)
        nullable: false
        unique: true
        description: Stable URL slug required by the shared Catalog contract.
      - name: title
        type: varchar(255)
        nullable: false
        description: Movie title.
      - name: description
        type: text
        nullable: false
        description: Movie synopsis.
        default: ''
      - name: release_date
        type: date
        nullable: true
        description: Release date.
      - name: duration_seconds
        type: integer
        nullable: false
        description: Duration in seconds.
      - name: poster_url
        type: text
        nullable: true
        description: Public poster URI.
      - name: video_path
        type: text
        nullable: true
        description: Internal storage key; not public.
      - name: is_published
        type: boolean
        nullable: false
        description: Visibility flag.
        default: 'false'
      - name: created_at
        type: timestamptz
        nullable: false
        description: UTC creation time.
        default: now()
      - name: updated_at
        type: timestamptz
        nullable: false
        description: UTC time of actual state change.
        default: now()
      - name: director
        type: varchar(255)
        nullable: false
        default: ''
        description: Director displayed by the shared MovieDetail schema.
      - name: cast
        type: jsonb
        nullable: false
        default: '[]'
        description: Ordered actor names returned as a JSON array.
      checks:
      - duration_seconds > 0
      - tmdb_id IS NULL OR tmdb_id > 0
      service_rules:
      - API durationMinutes = ceil(duration_seconds / 60); positionSeconds always uses seconds.
      - Published movie must provide a valid release year and poster URL required by core MovieSummary.
      - status maps published/hidden to is_published; averageRating is 0 when no ratings exist.
    genres:
      columns:
      - name: id
        type: uuid
        nullable: false
        description: Internal genre ID.
        primary_key: true
      - name: name
        type: varchar(80)
        nullable: false
        description: Canonical genre label; unique.
