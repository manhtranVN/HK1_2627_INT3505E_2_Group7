openapi: 3.0.3
info:
  title: MNP - Movie Navigator Promax API
  version: 0.3.0
  description: |
    RESTful API contract cho nền tảng xem phim online **MNP - Movie Navigator Promax** (Đồ án INT3505E - Nhóm 7).

    ### Phiên bản đặc tả
    - **v0.1 (Core Foundation):** Chuẩn `/api/v1`, UUID v4, lỗi RFC 7807 (`application/problem+json`), phân trang `PageMeta` và `bearerAuth` (JWT).
    - **v0.2 (Bản hiện tại - Mạnh / TV1):** Bổ sung đầy đủ endpoints **System**, **Auth** và **Catalog / Admin** (`Movies`, `Genres`).
    - **v1.0 (Sau khi merge PR đồng đội):** Tích hợp nhóm `/me/*` (QPhong / TV2) và nhóm gợi ý AI `/me/recommendations`, `/movies/{movieId}/similar` (Nguyên / TV4).

    ### Quy ước & Phạm vi MVP
    - **URI Versioning:** Mọi endpoint đặt dưới tiền tố `/api/v1`.
    - **Định danh tài nguyên:** Dùng UUID v4 do server sinh ra, tách biệt hoàn toàn với khóa nghiệp vụ (`email`, `slug`, `tmdbId`).
    - **Xác thực & Phân quyền:** Tách rõ xác thực (JWT Bearer token) khỏi phân quyền (RBAC 3 vai trò: `Guest`, `user`, `admin` và kiểm quyền sở hữu từng bản ghi trên `/me/*`).
    - **Phạm vi video MVP:** Chỉ phục vụ phát trực tiếp 2-3 video mẫu hợp lệ (`streamUrl`), không chuyển mã video tự động theo độ phân giải.
  contact:
    name: MNP API Engineering Team - Group 7 (INT3505E)
    email: api-group7@uet.vnu.edu.vn
    url: https://github.com/manhtranVN/HK1_2627_INT3505E_2_Group7
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000/api/v1
    description: Local Flask development server
  - url: http://localhost:4010/api/v1
    description: Local Swagger / Prism mock server

security:
  - bearerAuth: []

tags:
  - name: System
    description: Kiểm tra trạng thái sống và sẵn sàng của dịch vụ backend
  - name: Auth
    description: Đăng ký, đăng nhập và lấy thông tin tài khoản từ JWT
  - name: Movies
    description: Tra cứu, tìm kiếm, lọc và quản trị danh mục phim
  - name: Genres
    description: Tra cứu và quản trị danh mục thể loại phim
  - name: Me
    description: Tương tác cá nhân hóa của người dùng (QPhong - feat/data-model-me-api)
  - name: Recommendations
    description: Gợi ý phim theo nội dung và phương án dự phòng khi thiếu dữ liệu

paths:
  /health:
    get:
      operationId: getHealthStatus
      summary: Kiểm tra tình trạng hoạt động của API
      description: |
        Trả về trạng thái hiện tại của Flask API service và phiên bản contract đang phục vụ.
        Endpoint công khai phục vụ Docker healthcheck và giám sát cơ bản.
      tags:
        - System
      security: []
      responses:
        '200':
          description: Dịch vụ đang hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: mnp-api
                version: 0.2.0
                timestamp: '2026-11-23T10:00:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      operationId: registerUser
      summary: Đăng ký tài khoản người dùng mới
      description: |
        Tạo tài khoản `Registered User` mới với vai trò mặc định `user`.
        Email phải là duy nhất (không phân biệt hoa thường); mật khẩu được băm bằng bcrypt ở backend và không bao giờ xuất hiện trong response.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        description: Thông tin đăng ký tài khoản mới
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: minh.nguyen@example.com
              password: StrongPassword123!
              displayName: Nguyễn Văn Minh
      responses:
        '201':
          description: Đăng ký thành công, trả về access token và hồ sơ người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      operationId: loginUser
      summary: Đăng nhập và nhận JWT access token
      description: |
        Xác thực thông tin đăng nhập (email + password) và cấp JWT access token chứa `sub` (UUID user) và `role`.
        Trả lỗi 401 thống nhất khi email không tồn tại hoặc mật khẩu không khớp để tránh lộ thông tin tài khoản.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        description: Thông tin đăng nhập
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: minh.nguyen@example.com
              password: StrongPassword123!
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      operationId: getCurrentUserProfile
      summary: Lấy thông tin người dùng hiện tại từ JWT
      description: |
        Đọc danh tính người dùng từ `sub` trong JWT Bearer token (không nhận `userId` từ query/path).
        Khách chưa đăng nhập sẽ nhận `401 Unauthorized`.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ người dùng đang đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies:
    get:
      operationId: listMovies
      summary: Lấy danh sách phim có phân trang, tìm kiếm, lọc và sắp xếp
      description: |
        Cho phép Guest, Registered User và Admin duyệt danh mục phim.
        Mặc định chỉ trả phim có `status = published`. Tham số `includeHidden=true` chỉ có hiệu lực khi caller có vai trò `admin`; với Guest hoặc `user`, phim ẩn luôn được lọc bỏ.
      tags:
        - Movies
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchQueryParam'
        - $ref: '#/components/parameters/GenreFilterParam'
        - $ref: '#/components/parameters/ReleaseYearParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/IncludeHiddenParam'
      responses:
        '200':
          description: Danh sách phim phân trang thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      operationId: createMovie
      summary: Thêm phim mới vào danh mục (Chỉ Admin)
      description: |
        Tạo mới bản ghi phim kèm danh sách `genreIds` liên kết.
        Yêu cầu JWT với `role = admin`; tài khoản `user` thường nhận `403 Forbidden`.
      tags:
        - Movies
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Dữ liệu phim mới cần tạo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovieRequest'
            example:
              title: Sintel
              slug: sintel-2010
              overview: Một cô gái trẻ tên Sintel lên đường tìm kiếm chú rồng nhỏ Scales mà cô từng cứu và kết bạn.
              releaseYear: 2010
              durationMinutes: 15
              posterUrl: https://cdn.mnp.local/posters/sintel.jpg
              streamUrl: https://cdn.mnp.local/videos/sintel-sample.mp4
              director: Colin Levy
              cast:
                - Halina Reijn
                - Thom Hoffman
              genreIds:
                - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                - 7c9e6679-7425-40de-944b-e07fc1f90ae7
              tmdbId: 45745
              status: published
      responses:
        '201':
          description: Tạo phim mới thành công
          headers:
            Location:
              description: Đường dẫn tới tài nguyên phim vừa tạo
              schema:
                type: string
                example: /api/v1/movies/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/{movieId}:
    parameters:
      - $ref: '#/components/parameters/MovieIdPath'

    get:
      operationId: getMovieById
      summary: Xem thông tin chi tiết một bộ phim
      description: |
        Trả về metadata đầy đủ, danh sách thể loại nhúng (`genres[]`), trạng thái khả dụng video (`hasVideo`) và `streamUrl` (nếu có video mẫu).
        Nếu phim ở trạng thái `hidden` và người gọi không phải `admin`, API trả `404 Not Found` để không làm lộ sự tồn tại của phim bị ẩn.
      tags:
        - Movies
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncludeHiddenParam'
      responses:
        '200':
          description: Thông tin chi tiết phim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      operationId: updateMovie
      summary: Cập nhật một phần thông tin hoặc trạng thái ẩn/hiện phim (Chỉ Admin)
      description: |
        Cập nhật linh hoạt các trường của phim (bao gồm chuyển `status` giữa `published` và `hidden`).
        Yêu cầu tối thiểu 1 trường hợp lệ trong request body.
      tags:
        - Movies
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Các trường cần cập nhật của phim
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMovieRequest'
            example:
              status: hidden
              overview: Cập nhật mô tả tóm tắt phim phục vụ demo.
      responses:
        '200':
          description: Cập nhật phim thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      operationId: deleteMovie
      summary: Xóa mềm hoặc ẩn phim khỏi danh mục (Chỉ Admin)
      description: |
        Chuyển trạng thái phim sang ẩn/xóa khỏi danh mục công khai (soft delete để bảo toàn lịch sử tham chiếu).
        Yêu cầu JWT với `role = admin`.
      tags:
        - Movies
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Xóa/ẩn phim thành công (không có nội dung trả về)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /genres:
    get:
      operationId: listGenres
      summary: Lấy toàn bộ danh mục thể loại phim
      description: |
        Trả về danh sách thể loại sắp xếp theo tên, dùng cho bộ lọc phim của Guest và màn hình chọn sở thích ban đầu của Registered User.
      tags:
        - Genres
      security: []
      responses:
        '200':
          description: Danh sách thể loại phim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      operationId: createGenre
      summary: Thêm thể loại phim mới (Chỉ Admin)
      description: |
        Tạo mới một thể loại phim với `name` và `slug` duy nhất.
        Yêu cầu JWT với `role = admin`.
      tags:
        - Genres
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Thông tin thể loại mới
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenreRequest'
            example:
              name: Khoa học viễn tưởng
              slug: sci-fi
      responses:
        '201':
          description: Tạo thể loại thành công
          headers:
            Location:
              description: URI của thể loại vừa tạo (tra cứu qua bộ lọc danh sách thể loại)
              schema:
                type: string
                example: /api/v1/genres?slug=sci-fi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # INTEGRATION SLOTS FOR TEAMMATES (To be added via PRs before v1.0)
  # -------------------------------------------------------------------------
  # [QPhong - feat/data-model-me-api]:
  #   - GET    /me/favorites
  #   - PUT    /me/favorites/{movieId}
  #   - DELETE /me/favorites/{movieId}
  #   - PUT    /me/ratings/{movieId}
  #   - PUT    /me/watch-progress/{movieId}
  #   - PUT    /me/preferences/genres
  # [Nguyên - feat/brief-ai-plan]:
  #   - GET    /movies/{movieId}/similar
  # =========================================================================

  /me/favorites:
    get:
      tags:
      - Me
      operationId: listMyFavorites
      summary: List my favorite published movies
      description: Identity comes from JWT sub. Order createdAt DESC then movieId ASC. Hidden movies are excluded
        from both items and pagination totals.
      x-owner: QPhong
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritePage'
              example:
                items:
                - movieId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  movie:
                    id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    title: Sintel
                    slug: sintel-2010
                    releaseYear: 2010
                    durationMinutes: 15
                    posterUrl: https://cdn.mnp.local/posters/sintel.jpg
                    genres:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      name: Hoạt hình
                      slug: animation
                    averageRating: 4.6
                    ratingCount: 128
                    hasVideo: true
                    status: published
                  createdAt: '2026-11-24T03:00:00Z'
                meta:
                  page: 1
                  limit: 20
                  totalItems: 1
                  totalPages: 1
                  hasNext: false
                  hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      x-db-tables:
      - favorites
      - movies
      - genres
      - movie_genres
      - ratings
      security:
      - bearerAuth: []
  /me/favorites/{movieId}:
    put:
      tags:
      - Me
      operationId: putMyFavorite
      summary: Ensure the movie is a favorite
      description: Create favorite for JWT sub (201 with Location), or return existing state unchanged (200). No request
        body. Repeated PUT never creates another row or changes createdAt. Movie must be published.
      x-owner: QPhong
      x-roles:
      - user
      - admin
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '200':
          description: Existing favorite, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
              example:
                movieId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                movie:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  title: Sintel
                  slug: sintel-2010
                  releaseYear: 2010
                  durationMinutes: 15
                  posterUrl: https://cdn.mnp.local/posters/sintel.jpg
                  genres:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    name: Hoạt hình
                    slug: animation
                  averageRating: 4.6
                  ratingCount: 128
                  hasVideo: true
                  status: published
                createdAt: '2026-11-24T03:00:00Z'
        '201':
          description: Favorite created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
              example:
                movieId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                movie:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  title: Sintel
                  slug: sintel-2010
                  releaseYear: 2010
                  durationMinutes: 15
                  posterUrl: https://cdn.mnp.local/posters/sintel.jpg
                  genres:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    name: Hoạt hình
                    slug: animation
                  averageRating: 4.6
                  ratingCount: 128
                  hasVideo: true
                  status: published
                createdAt: '2026-11-24T03:00:00Z'
          headers:
            Location:
              description: URI of the current user favorite.
              schema:
                type: string
                example: /api/v1/me/favorites/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
      parameters:
      - $ref: '#/components/parameters/MovieIdPath'
      x-db-tables:
      - favorites
      - movies
      security:
      - bearerAuth: []
    delete:
      tags:
      - Me
      operationId: deleteMyFavorite
      summary: Remove a favorite
      description: Always 204 for a valid movie UUID even when the relation/movie is absent or hidden. Operates only
        on JWT sub and never reveals movie visibility.
      x-owner: QPhong
      x-roles:
      - user
      - admin
      responses:
        '204':
          description: Successful response with no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/MovieIdPath'
      x-db-tables:
      - favorites
      security:
      - bearerAuth: []
  /me/ratings/{movieId}:
    put:
      tags:
      - Me
      operationId: putMyRating
      summary: Create or replace my rating
      description: 200 on create or replace. One row per user/movie. Same score is a no-op and preserves updatedAt.
        score is 1..5.0 in steps of 0.5. Movie must be published.
      x-owner: QPhong
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
              example:
                movieId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                score: 4.5
                updatedAt: '2026-11-24T03:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
