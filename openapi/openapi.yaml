  /me/recommendations:
    get:
      operationId: getMyRecommendations
      summary: Lấy danh sách phim gợi ý cho người dùng hiện tại
      description: |
        Xác định người dùng từ claim sub của JWT. Tài khoản user và admin đều nhận gợi ý cho chính mình.

        Khi có đủ dữ liệu tương tác, dùng gợi ý theo nội dung (content_based).
        Khi chưa đủ dữ liệu tương tác, ưu tiên các thể loại người dùng đã chọn (genre_fallback).
        Dùng phim phổ biến (popular_fallback) khi không có phim khớp thể loại hoặc mô hình không khả dụng.

        Chỉ trả phim published, mỗi phim xuất hiện tối đa một lần. Kết quả xếp theo score giảm dần,
        dùng ID phim tăng dần khi bằng điểm. Có thể trả ít hơn limit, kể cả danh sách rỗng.
      tags:
        - Recommendations
      x-owner: Nguyên
      x-roles:
        - user
        - admin
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Số phim gợi ý tối đa trả về (top-K)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10
      responses:
        '200':
          description: Danh sách gợi ý đã xếp hạng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResult'
              examples:
                personalized:
                  summary: Gợi ý từ lịch sử tương tác
                  value:
                    items:
                      - movie:
                          id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                          title: Sintel
                          slug: sintel-2010
                          releaseYear: 2010
                          durationMinutes: 15
                          posterUrl: https://cdn.mnp.local/posters/sintel.jpg
                          genres:
                            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                              name: Hoạt hình
                              slug: animation
                          averageRating: 4.6
                          ratingCount: 128
                          hasVideo: true
                          status: published
                        score: 0.94
                        reason: Phim có nội dung tương tự những phim bạn đã đánh giá cao.
                    strategy: content_based
                    modelVersion: '1.0.0'
                    generatedAt: '2026-11-25T08:00:00Z'
                genreFallback:
                  summary: Người dùng mới đã chọn thể loại yêu thích
                  value:
                    items:
                      - movie:
                          id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                          title: Sintel
                          slug: sintel-2010
                          releaseYear: 2010
                          durationMinutes: 15
                          posterUrl: https://cdn.mnp.local/posters/sintel.jpg
                          genres:
                            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                              name: Hoạt hình
                              slug: animation
                          averageRating: 4.6
                          ratingCount: 128
                          hasVideo: true
                          status: published
                        score: 0.9
                        reason: Phim thuộc thể loại Hoạt hình bạn đã chọn.
                    strategy: genre_fallback
                    modelVersion: null
                    generatedAt: '2026-11-25T08:00:00Z'
                popularFallback:
                  summary: Gợi ý phim phổ biến khi thiếu dữ liệu cá nhân hóa
                  value:
                    items:
                      - movie:
                          id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                          title: Sintel
                          slug: sintel-2010
                          releaseYear: 2010
                          durationMinutes: 15
                          posterUrl: https://cdn.mnp.local/posters/sintel.jpg
                          genres:
                            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                              name: Hoạt hình
                              slug: animation
                          averageRating: 4.6
                          ratingCount: 128
                          hasVideo: true
                          status: published
                        score: 0.85
                        reason: Phim được nhiều người xem quan tâm.
                    strategy: popular_fallback
                    modelVersion: null
                    generatedAt: '2026-11-25T08:00:00Z'
                emptyCatalog:
                  summary: Danh mục không có phim công khai
                  value:
                    items: []
                    strategy: popular_fallback
                    modelVersion: null
                    generatedAt: '2026-11-25T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Access Token cấp bởi `POST /api/v1/auth/login` hoặc `POST /api/v1/auth/register`.
        Header mẫu: `Authorization: Bearer <jwt_token>`.
        Payload token mang `sub` (UUID người dùng), `role` (`user` | `admin`), `iat` và `exp`.

  parameters:
    MovieIdPath:
      name: movieId
      in: path
      required: true
      description: Định danh UUID v4 duy nhất của phim
      schema:
        type: string
        format: uuid
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d

    PageParam:
      name: page
      in: query
      required: false
      description: Số thứ tự trang (bắt đầu từ 1)
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: Số lượng bản ghi tối đa trên mỗi trang (từ 1 đến 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    SearchQueryParam:
      name: q
      in: query
      required: false
      description: Từ khóa tìm kiếm theo tên phim, diễn viên hoặc đạo diễn
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: Sintel

    GenreFilterParam:
      name: genre
      in: query
      required: false
      description: Lọc theo `slug` hoặc UUID của thể loại
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: animation

    ReleaseYearParam:
      name: year
      in: query
      required: false
      description: Lọc theo năm phát hành phim
      schema:
        type: integer
        minimum: 1900
        maximum: 2100
      example: 2010

    SortByParam:
      name: sortBy
      in: query
      required: false
      description: Trường sắp xếp kết quả danh sách phim
      schema:
        type: string
        enum:
          - createdAt
          - releaseYear
          - averageRating
          - title
          - popularity
        default: createdAt
      example: averageRating

    SortOrderParam:
      name: sortOrder
      in: query
      required: false
      description: Thứ tự sắp xếp tăng dần (`asc`) hoặc giảm dần (`desc`)
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      example: desc

    IncludeHiddenParam:
      name: includeHidden
      in: query
      required: false
      description: Chỉ dành cho `admin` để xem cả phim ở trạng thái `hidden`; bỏ qua với Guest và `user`
      schema:
        type: boolean
        default: false
      example: false

  schemas:
    ErrorCode:
      type: string
      description: Mã lỗi nghiệp vụ chuẩn hóa để frontend xử lý theo nhánh logic cố định
      enum:
        - BAD_REQUEST
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - EMAIL_ALREADY_EXISTS
        - SLUG_ALREADY_EXISTS
        - INTERNAL_SERVER_ERROR
      example: NOT_FOUND

    FieldError:
      type: object
      description: Chi tiết lỗi kiểm tra hợp lệ theo từng trường dữ liệu đầu vào
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Tên trường gây lỗi (hỗ trợ dot-notation)
          example: releaseYear
        message:
          type: string
          description: Mô tả nguyên nhân lỗi của trường này
          example: Năm phát hành phải nằm trong khoảng từ 1900 đến 2100.

    ProblemDetails:
      type: object
      description: Cấu trúc phản hồi lỗi thống nhất theo chuẩn RFC 7807 (`application/problem+json`)
      required:
        - type
        - title
        - status
        - detail
        - instance
        - traceId
        - errorCode
      properties:
        type:
          type: string
          format: uri
          description: URI định danh loại lỗi
          example: https://api.mnp.local/errors/not-found
        title:
          type: string
          description: Tóm tắt ngắn gọn loại lỗi
          example: Resource Not Found
        status:
          type: integer
          format: int32
          description: Mã trạng thái HTTP
          example: 404
        detail:
          type: string
          description: Giải thích cụ thể cho lần phát sinh lỗi này
          example: Không tìm thấy phim với ID '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'.
        instance:
          type: string
          description: Đường dẫn request xảy ra lỗi
          example: /api/v1/movies/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        traceId:
          type: string
          format: uuid
          description: Mã truy vết request phục vụ chẩn đoán và đối soát log
          example: d4b1a432-843e-462f-8703-9bb59cba67c8
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Danh sách lỗi chi tiết từng trường (thường có khi HTTP status là 422)
          items:
            $ref: '#/components/schemas/FieldError'

    PageMeta:
      type: object
      description: Siêu dữ liệu phân trang dùng chung cho mọi collection endpoint
      required:
        - page
        - limit
        - totalItems
        - totalPages
        - hasNext
        - hasPrev
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          minimum: 0
          example: 540
        totalPages:
          type: integer
          minimum: 0
          example: 27
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false

    HealthStatus:
      type: object
      description: Trạng thái hoạt động của dịch vụ backend
      required:
        - status
        - service
        - version
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        service:
          type: string
          example: mnp-api
        version:
          type: string
          example: 0.2.0
        timestamp:
          type: string
          format: date-time
          example: '2026-11-23T10:00:00Z'

    UserRole:
      type: string
      description: Vai trò người dùng đã xác thực trong hệ thống (Guest không có token)
      enum:
        - user
        - admin
      example: user

    RegisterRequest:
      type: object
      description: Payload đăng ký tài khoản mới
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: minh.nguyen@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Mật khẩu thô gửi qua HTTPS (giới hạn 72 byte tương thích bcrypt)
          example: StrongPassword123!
        displayName:
          type: string
          minLength: 2
          maxLength: 80
          example: Nguyễn Văn Minh

    LoginRequest:
      type: object
      description: Payload đăng nhập tài khoản
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: minh.nguyen@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          example: StrongPassword123!

    UserProfile:
      type: object
      description: Biểu diễn API công khai của người dùng (ẩn passwordHash)
      required:
        - id
        - email
        - displayName
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: c56a4180-65aa-42ec-a945-5fd21dec0538
        email:
          type: string
          format: email
          example: minh.nguyen@example.com
        displayName:
          type: string
          example: Nguyễn Văn Minh
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-23T09:30:00Z'

    AuthTokenResponse:
      type: object
      description: Phản hồi cấp JWT token sau khi đăng ký hoặc đăng nhập thành công
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: Chuỗi JWT đã ký
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjNTZhNDE4MC02NWFhLTQyZWMtYTk0NS01ZmQyMWRlYzA1MzgiLCJyb2xlIjoidXNlciJ9.signature
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          minimum: 60
          description: Thời gian sống của access token tính bằng giây
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'

    Genre:
      type: object
      description: Thông tin thể loại phim
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: Hoạt hình
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 64
          example: animation

    CreateGenreRequest:
      type: object
      description: Payload tạo thể loại mới (Admin)
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: Khoa học viễn tưởng
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 1
          maxLength: 64
          example: sci-fi

    GenreListResponse:
      type: object
      description: Danh sách toàn bộ thể loại phim
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        total:
          type: integer
          minimum: 0
          example: 12

    MovieStatus:
      type: string
      description: Trạng thái hiển thị phim trong danh mục
      enum:
        - published
        - hidden
      example: published

    MovieSummary:
      type: object
      description: Thông tin tóm tắt phim trong danh sách (nhúng genres[] thay vì bảng nối DB)
      required:
        - id
        - title
        - slug
        - releaseYear
        - durationMinutes
        - posterUrl
        - genres
        - averageRating
        - ratingCount
        - hasVideo
        - status
      properties:
        id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        title:
          type: string
          example: Sintel
        slug:
          type: string
          example: sintel-2010
        releaseYear:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2010
        durationMinutes:
          type: integer
          minimum: 1
          example: 15
        posterUrl:
          type: string
          format: uri
          example: https://cdn.mnp.local/posters/sintel.jpg
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        averageRating:
